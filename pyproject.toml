[project]
name = "threat-intelligence-rag-assistant"
version = "0.1.0"
description = "An explainable RAG assistant for mapping behavior descriptions to MITRE ATT&CK Enterprise techniques."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastembed>=0.7.0,<1.0.0",
    "fastapi[standard]>=0.139.0",
    "langchain-core>=1.0.0,<2.0.0",
    "pydantic>=2.12.5",
    "rank-bm25>=0.2.2,<1.0.0",
    "stix2>=3.0.1",
    "truststore>=0.10.4,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threat_intelligence_rag"]

[project.scripts]
threat-rag-parse = "threat_intelligence_rag.ingestion.mitre_parser:main"
threat-rag-documents = "threat_intelligence_rag.ingestion.technique_documents:main"
threat-rag-search = "threat_intelligence_rag.cli.search:main"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=8.4.2",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
